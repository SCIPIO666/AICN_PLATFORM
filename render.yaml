##############################################################################
# Render Blueprint for the AICN Training Platform - FREE TIER
##############################################################################

databases:
  - name: aicn-db
    plan: free
    region: oregon

services:
  # ── Backend API ──────────────────────────────────────────────────────
  - type: web
    name: aicn-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npx prisma generate
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    
    envVars:
      - key: NODE_ENV
        value: production
      
      - key: PORT
        value: 3000
      
      - key: DATABASE_URL
        fromDatabase:
          name: aicn-db
          property: connectionString
      
      - key: JWT_SECRET
        generateValue: true
      
      - key: FRONTEND_URL
        fromService:
          name: aicn-client
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      
      - key: SUPPORT_EMAIL
        value: eaphoney@gmail.com
      
      - key: SEND_TEST_EMAIL
        value: 'false'
      
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

  # ── Frontend (static build) ──────────────────────────────────────────
  - type: web
    name: aicn-client
    runtime: static
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    
    routes:
      - type: rewrite
        source: /api/*
        destination: https://aicn-server.onrender.com/api/*
      
      - type: rewrite
        source: /*
        destination: /index.html