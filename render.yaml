##############################################################################
# Render Blueprint for the AICN Training Platform - FREE TIER
#
# This configuration uses ONLY free resources:
# - Free Postgres (expires after 90 days, good for testing)
# - Free web services (512MB RAM each)
# - Auto-deploy on commit
##############################################################################

databases:
  - name: aicn-db
    plan: free              # ✅ FREE - 90 day expiry, good for testing/development
    region: oregon           # Choose: oregon, ohio, frankfurt, singapore

services:
  # ── Backend API ──────────────────────────────────────────────────────
  - type: web
    name: aicn-server
    runtime: node
    plan: free              #  FREE - 512MB RAM, sleeps after inactivity
    region: oregon
    rootDir: server
    buildCommand: npm install && npx prisma generate
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    
    #   Free tier services sleep after inactivity
    # To keep it awake, set this to true (but costs if you exceed free hours)
    # sleepAfterInactivity: false
    sleepAfterInactivity: true   # Free tier defaults to sleep after 15min inactivity
    
    envVars:
      - key: NODE_ENV
        value: production
      
      - key: PORT
        value: 3000
      
      - key: DATABASE_URL
        fromDatabase:
          name: aicn-db
          property: connectionString
      
      - key: JWT_SECRET
        generateValue: true
      
      - key: FRONTEND_URL
        fromService:
          name: aicn-client
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      
      - key: SUPPORT_EMAIL
        value: eaphoney@gmail.com
      
      - key: SEND_TEST_EMAIL
        value: 'false'
      
      #  Cloudinary - FREE (optional, set to false if not using)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      
      #  Email - FREE (using Gmail SMTP, no cost)
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

  # ── Frontend (static build) ──────────────────────────────────────────
  - type: web
    name: aicn-client
    runtime: static
    plan: free              #  FREE - Static sites are always free
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    
    routes:
      #  Proxy API requests to backend
      - type: rewrite
        source: /api/*
        destination: https://aicn-server.onrender.com/api/*
      
      #  SPA fallback - supports React Router
      - type: rewrite
        source: /*
        destination: /index.html