##############################################################################
# Render Blueprint — AICN Training Platform (FREE TIER)
# Monorepo structure:
#   AICN_PLATFORM/
#     package.json    root deps (zod, shared validators)
#     shared/         shared validators/types used by server
#     server/         Express API
#     client/        Vite React SPA
##############################################################################

name: AICN Training Platform

databases:
  - name: aicn-db
    plan: free
    region: oregon

services:

  # Backend API 
  - type: web
    name: aicn-server
    runtime: node
    plan: free
    region: oregon

    buildCommand: >-
      npm install &&
      cd shared && npm install && cd .. &&
      npm install &&
      cd server &&
      npm install &&
      npx prisma generate &&
      npx prisma migrate deploy

    startCommand: cd server && npm start

    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 3000

      - key: DATABASE_URL
        fromDatabase:
          name: aicn-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: FRONTEND_URL
        fromService:
          name: aicn-client
          type: web
          envVarKey: RENDER_EXTERNAL_URL

      - key: SUPPORT_EMAIL
        value: eaphoney@gmail.com

      - key: SEND_TEST_EMAIL
        value: 'false'

      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

  # ── Frontend (Vite static site) 
  # Static site-no region field on  free tier
  - type: web
    name: aicn-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit

    envVars:
      - key: VITE_API_URL
        fromService:
          name: aicn-server
          type: web
          envVarKey: RENDER_EXTERNAL_URL

    routes:
      # SPA fallback — all client-side routes serve index.html
      - type: rewrite
        source: /*
        destination: /index.html