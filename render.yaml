##############################################################################
# Render Blueprint — AICN Training Platform (FREE TIER)
# npm workspaces monorepo:
#   package.json      workspace root ("workspaces": [shared, server, client])
#   shared/           validators shared between client + server
#   server/           Express API
#   client/           Vite React SPA
##############################################################################

databases:
  - name: aicn-db
    plan: free
    region: oregon

services:

  #Backend API 
  - type: web
    name: aicn-server
    runtime: node
    plan: free
    region: oregon

    buildCommand: npm install && cd server && npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: cd server && npm start

    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: aicn-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: FRONTEND_URL
        fromService:
          name: aicn-client
          type: web
          envVarKey: RENDER_EXTERNAL_URL

      - key: SUPPORT_EMAIL
        value: eaphoney@gmail.com

      - key: SEND_TEST_EMAIL
        value: 'false'

      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

  #Frontend (Vite static site) 
  - type: web
    name: aicn-client
    runtime: static
    buildCommand: npm install && cd client && npm run build
    staticPublishPath: client/dist
    autoDeployTrigger: commit

    envVars:
      - key: VITE_API_URL
        fromService:
          name: aicn-server
          type: web
          envVarKey: RENDER_EXTERNAL_URL

    routes:
      - type: rewrite
        source: /*
        destination: /index.html