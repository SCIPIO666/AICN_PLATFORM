<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="seal-outer" cx="50%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#f5c842"/>
      <stop offset="45%"  stop-color="#c8860a"/>
      <stop offset="100%" stop-color="#7a4f05"/>
    </radialGradient>
    <radialGradient id="seal-inner" cx="50%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#fde68a"/>
      <stop offset="50%"  stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>
    <filter id="seal-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000040"/>
    </filter>
  </defs>

  <!-- Outer starburst ring — 24 points -->
  <g filter="url(#seal-shadow)">
    <polygon fill="url(#seal-outer)" points="
      60,4  64.5,12  73,8  74,17  83,16  81,25  90,27  85,35
      93,40  86,46  92,53  84,57  87,66  78,67  78,76  69,75
      66,84  57,80  51,88  45,82  36,85  35,76  26,74  28,65
      19,61  23,52  14,46  21,40  14,33  22,28  18,19  27,17
      26,8   35,10  38,2   47,6
    "/>
    <!-- Inner starburst -->
    <polygon fill="url(#seal-inner)" points="
      60,14  63.5,20  70,17  70.5,24  77,22  75.5,29  82,30  79,36
      85,39  81,44  86,49  81,52  83,58  78,59  78,65  72,64
      70,70  64,67  60,72  56,67  50,70  48,64  42,65  42,59
      37,58  39,52  34,49  39,44  35,39  41,36  38,30  45,29
      43.5,22  50,24  49.5,17  56,20
    "/>
  </g>

  <!-- Center circle -->
  <circle cx="60" cy="60" r="28" fill="url(#seal-outer)" filter="url(#seal-shadow)"/>
  <circle cx="60" cy="60" r="24" fill="#1a0f02"/>
  <circle cx="60" cy="60" r="21" fill="none" stroke="#d97706" stroke-width="1"/>

  <!-- AICN text in center -->
  <text x="60" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#f5c842" letter-spacing="2">AICN</text>
  <text x="60" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="6" fill="#d97706" letter-spacing="1.5">CERTIFIED</text>

  <!-- Stars around inner circle -->
  <text x="60" y="77" text-anchor="middle" font-size="7" fill="#d97706">★  ★  ★</text>
</svg>
