<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="120" height="120">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f5e6a3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="url(#gold)" stroke-width="2"/>
  
  <!-- Text around edge -->
  <path id="top-text" d="M 30 100 A 70 70 0 0 1 170 100" fill="none"/>
  <text font-family="'Cinzel', serif" font-size="12" fill="#d4af37" font-weight="bold" letter-spacing="3">
    <textPath href="#top-text" startOffset="50%" text-anchor="middle">
      AFRICA INSTITUTE OF COMPUTER NETWORKING
    </textPath>
  </text>
  
  <!-- Star in center -->
  <polygon points="100,40 110,80 150,80 118,105 130,145 100,122 70,145 82,105 50,80 90,80" 
           fill="url(#gold)" stroke="#b8960c" stroke-width="1"/>
  
  <!-- Small stars around -->
  <text x="50" y="50" fill="#d4af37" font-size="14">★</text>
  <text x="150" y="50" fill="#d4af37" font-size="14">★</text>
  <text x="50" y="155" fill="#d4af37" font-size="14">★</text>
  <text x="150" y="155" fill="#d4af37" font-size="14">★</text>
</svg>