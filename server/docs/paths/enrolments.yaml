/enrolments:
  get:
    summary: Get all enrolments
    tags:
      - Enrolments
    security:
      - bearerAuth: []
    parameters:
      - name: userId
        in: query
        schema:
          type: string
      - name: sessionId
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
          enum: [ENROLLED, ATTENDED, ABSENT, CANCELLED]
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 10
    responses:
      '200':
        description: Enrolments retrieved
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaginatedResponse'
      '401':
        $ref: '#/components/responses/UnauthorizedError'

  post:
    summary: Enroll in a session
    tags:
      - Enrolments
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateEnrolmentInput'
    responses:
      '201':
        description: Enrolled successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  $ref: '#/components/schemas/Enrolment'
      '400':
        $ref: '#/components/responses/ValidationError'
      '401':
        $ref: '#/components/responses/UnauthorizedError'
      '409':
        description: Already enrolled or session full

/enrolments/bulk:
  post:
    summary: Bulk enroll users (ADMIN only)
    tags:
      - Enrolments
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BulkEnrolmentInput'
    responses:
      '201':
        description: Bulk enrolment completed
      '400':
        $ref: '#/components/responses/ValidationError'
      '401':
        $ref: '#/components/responses/UnauthorizedError'
      '403':
        $ref: '#/components/responses/ForbiddenError'

/enrolments/{id}:
  get:
    summary: Get enrolment by ID
    tags:
      - Enrolments
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Enrolment retrieved
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  $ref: '#/components/schemas/Enrolment'
      '401':
        $ref: '#/components/responses/UnauthorizedError'
      '404':
        $ref: '#/components/responses/NotFoundError'

  put:
    summary: Update enrolment status
    tags:
      - Enrolments
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateEnrolmentInput'
    responses:
      '200':
        description: Enrolment updated
      '401':
        $ref: '#/components/responses/UnauthorizedError'
      '403':
        $ref: '#/components/responses/ForbiddenError'
      '404':
        $ref: '#/components/responses/NotFoundError'

  delete:
    summary: Cancel enrolment
    tags:
      - Enrolments
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Enrolment cancelled
      '401':
        $ref: '#/components/responses/UnauthorizedError'
      '404':
        $ref: '#/components/responses/NotFoundError'