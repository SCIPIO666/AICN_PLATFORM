/certificates:
  post:
    summary: Issue certificate (ADMIN only)
    tags:
      - Certificates
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IssueCertificateInput'
    responses:
      '201':
        description: Certificate issued
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  $ref: '#/components/schemas/Certificate'
      '400':
        $ref: '#/components/responses/ValidationError'
      '401':
        $ref: '#/components/responses/UnauthorizedError'
      '403':
        $ref: '#/components/responses/ForbiddenError'

/certificates/verify/{certCode}:
  get:
    summary: Verify certificate
    tags:
      - Certificates
    parameters:
      - name: certCode
        in: path
        required: true
        schema:
          type: string
          pattern: '^CERT-[A-F0-9]{16}$'
    responses:
      '200':
        description: Certificate is valid
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  $ref: '#/components/schemas/Certificate'
      '404':
        description: Certificate not found
      '410':
        description: Certificate has been revoked

/certificates/my:
  get:
    summary: Get my certificates
    tags:
      - Certificates
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Certificates retrieved
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/Certificate'
      '401':
        $ref: '#/components/responses/UnauthorizedError'

/certificates/session/{sessionId}:
  get:
    summary: Get certificates for a session (ADMIN only)
    tags:
      - Certificates
    security:
      - bearerAuth: []
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Session certificates retrieved
      '401':
        $ref: '#/components/responses/UnauthorizedError'
      '403':
        $ref: '#/components/responses/ForbiddenError'

/certificates/{id}:
  delete:
    summary: Revoke certificate (ADMIN only)
    tags:
      - Certificates
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              reason:
                type: string
                example: Issued in error
    responses:
      '200':
        description: Certificate revoked
      '401':
        $ref: '#/components/responses/UnauthorizedError'
      '403':
        $ref: '#/components/responses/ForbiddenError'
      '404':
        $ref: '#/components/responses/NotFoundError'