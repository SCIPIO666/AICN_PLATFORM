      summary: Update user role (ADMIN only)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleInput'
      responses:
        '200':
          description: Role updated
        '400':
          description: Cannot demote last admin

  /admin/announcements:
    get:
      summary: Get all announcements (ADMIN only)
      tags: [Admin]
      security:
