        '201':
          description: Announcement created

  /admin/announcements/{id}:
    put:
      summary: Update announcement (ADMIN only)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnnouncementInput'
