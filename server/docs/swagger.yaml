    get:
      summary: Verify a certificate
      description: Public endpoint to verify certificate authenticity
      tags: [Certificates]
      parameters:
        - name: certCode
          in: path
          required: true
          schema:
            type: string
            pattern: '^CERT-[A-F0-9]{16}$'
      responses:
        '200':
          description: Certificate verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Certificate verified successfully
                  data:
                    $ref: '#/components/schemas/Certificate'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Certificate not found
        '409':
          description: Certificate has been revoked

