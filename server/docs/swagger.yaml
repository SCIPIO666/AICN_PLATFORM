openapi: 3.0.0
info:
  title: AICN Training Management System API
  version: 2.1.0
  description: |
    Complete API documentation for the AICN Training Management System.
    
    ## Features
    * Public session browsing with advanced filters
    * Self-service enrolment and cancellation
    * Trainer attendance tracking
    * Certificate management with batch issuance
    * Admin dashboard with user management
    * Trainer application workflow with approval system
    * Announcement system with audience targeting
    
    ## Authentication
    Most endpoints require JWT authentication. Include the token in requests:
    
    `Authorization: Bearer <your-token>`
    
    ## Base URL
    All endpoints are prefixed with `/api/v1`
    
    ## Role-Based Access Control
    
    | Role | Permissions |
    |------|-------------|
    | **LEARNER** | Browse sessions, enrol, cancel own enrolments, view own certificates, apply for trainer |
    | **TRAINER** | All LEARNER permissions + mark attendance, view assigned sessions, view own trainer profile |
    | **ADMIN** | Full system access + user management, batch operations, announcements, approve/reject trainers |
    
    ## Validation
    All endpoints include Zod schema validation with descriptive error messages.
    
  contact:
    name: API Support
    email: support@aicn.africa
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000/api/v1
    description: Development server
  - url: https://staging-api.aicn.africa/api/v1
    description: Staging server
  - url: https://api.aicn.africa/api/v1
    description: Production server

tags:
  - name: Authentication
    description: User registration, login, password management, and profile
  - name: Sessions
    description: Session browsing and management (ADMIN only for write operations)
  - name: Enrolments
    description: Self-service enrolment, cancellation, and attendance tracking
  - name: Certificates
    description: Certificate issuance, verification, and download
  - name: Trainers
    description: Trainer application, profile management, and admin approval
  - name: Admin
    description: Administrative operations including user management and announcements

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your JWT token (get from /auth/login)

  schemas:
    # ==================== USER SCHEMAS ====================
    User:
      type: object
      properties:
        id:
          type: string
          example: cm3n7t4xg0000j4k5a1b2c3d
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        phone:
          type: string
          pattern: '^\+?254[0-9]{9}$|^0[0-9]{9}$'
          example: +254712345678
          nullable: true
        county:
          type: string
          minLength: 2
          maxLength: 50
          example: Nairobi
          nullable: true
        role:
          type: string
          enum: [LEARNER, TRAINER, ADMIN]
          example: LEARNER
        emailVerified:
          type: boolean
          example: false
        isActive:
          type: boolean
          example: true
        profilePicture:
          type: string
          nullable: true
          example: https://storage.aicn.africa/profiles/avatar.jpg
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ==================== AUTH SCHEMAS ====================
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          pattern: '^[a-zA-Z\s]+$'
          example: John Doe
        email:
          type: string
          format: email
          minLength: 5
          maxLength: 255
          example: john@example.com
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 100
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{6,}$'
          description: Must contain at least one uppercase, one lowercase, one number, and one special character
          example: Password123!
        phone:
          type: string
          pattern: '^\+?254[0-9]{9}$|^0[0-9]{9}$'
          example: +254712345678
        county:
          type: string
          minLength: 2
          maxLength: 50
          example: Nairobi

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          format: password
          example: Password123!

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Login successful
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            token:
              type: string
              example: eyJhbGciOiJIUzI1NiIs...
            expiresIn:
              type: integer
              example: 604800000

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: john@example.com

    ResetPasswordRequest:
      type: object
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 10
          maxLength: 500
          example: 8f3e2a1b9c7d4e5f6a7b8c9d0e1f2a3b
        newPassword:
          type: string
          minLength: 6
          maxLength: 100
          example: NewPassword456!
        confirmPassword:
          type: string
          example: NewPassword456!

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
        - confirmPassword
      properties:
        currentPassword:
          type: string
          example: OldPassword123!
        newPassword:
          type: string
          minLength: 6
          maxLength: 100
          example: NewPassword456!
        confirmPassword:
          type: string
          example: NewPassword456!

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: John Smith
        phone:
          type: string
          pattern: '^\+?254[0-9]{9}$|^0[0-9]{9}$'
          example: +254798765432
        county:
          type: string
          minLength: 2
          maxLength: 50
          example: Mombasa

    # ==================== SESSION SCHEMAS ====================
    Session:
      type: object
      properties:
        id:
          type: string
          example: cm3n7t4xg0000j4k5a1b2c3d
        title:
          type: string
          minLength: 3
          maxLength: 200
          example: Advanced JavaScript Workshop
        skillArea:
          type: string
          minLength: 2
          maxLength: 100
          example: Programming
        description:
          type: string
          maxLength: 2000
          nullable: true
          example: Deep dive into modern JavaScript concepts
        date:
          type: string
          format: date-time
          example: 2024-12-15T10:00:00Z
        durationMins:
          type: integer
          minimum: 30
          maximum: 480
          example: 120
        locationType:
          type: string
          enum: [PHYSICAL, ONLINE]
          example: ONLINE
        venue:
          type: string
          minLength: 3
          maxLength: 500
          nullable: true
          example: https://zoom.us/join/123456
        meetingLink:
          type: string
          format: uri
          nullable: true
          example: https://zoom.us/j/123456789
        county:
          type: string
          minLength: 2
          maxLength: 50
          nullable: true
          example: Nairobi
        capacity:
          type: integer
          minimum: 1
          maximum: 100
          example: 30
        status:
          type: string
          enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED]
          example: SCHEDULED
        trainerId:
          type: string
          nullable: true
          example: cm3n7t4xg0000j4k5a1b2c3d
        enrolledCount:
          type: integer
          example: 15
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateSessionInput:
      type: object
      required:
        - title
        - skillArea
        - date
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
          example: Advanced JavaScript Workshop
        skillArea:
          type: string
          minLength: 2
          maxLength: 100
          example: Programming
        description:
          type: string
          maxLength: 2000
          nullable: true
        date:
          type: string
          format: date-time
          description: Must be in the future
        durationMins:
          type: integer
          minimum: 30
          maximum: 480
          default: 120
        locationType:
          type: string
          enum: [PHYSICAL, ONLINE]
          default: PHYSICAL
        venue:
          type: string
          minLength: 3
          maxLength: 500
          description: Required if locationType is PHYSICAL
        meetingLink:
          type: string
          format: uri
          description: Required if locationType is ONLINE
        county:
          type: string
          minLength: 2
          maxLength: 50
        capacity:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
        trainerId:
          type: string
          nullable: true

    UpdateSessionInput:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        skillArea:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        date:
          type: string
          format: date-time
        durationMins:
          type: integer
          minimum: 30
          maximum: 480
        locationType:
          type: string
          enum: [PHYSICAL, ONLINE]
        venue:
          type: string
          minLength: 3
          maxLength: 500
        meetingLink:
          type: string
          format: uri
        county:
          type: string
          minLength: 2
          maxLength: 50
        capacity:
          type: integer
          minimum: 1
          maximum: 100
        status:
          type: string
          enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED]
        trainerId:
          type: string
          nullable: true

    SessionFilters:
      type: object
      properties:
        upcoming:
          type: boolean
          description: Filter to upcoming sessions only
        status:
          type: string
          enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED]
        skillArea:
          type: string
        locationType:
          type: string
          enum: [PHYSICAL, ONLINE]
        county:
          type: string
        trainerId:
          type: string
        fromDate:
          type: string
          format: date-time
        toDate:
          type: string
          format: date-time
        page:
          type: integer
          minimum: 1
          default: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 10

    # ==================== ENROLMENT SCHEMAS ====================
    Enrolment:
      type: object
      properties:
        id:
          type: string
          example: cm3n7t4xg0000j4k5a1b2c3d
        userId:
          type: string
        sessionId:
          type: string
        status:
          type: string
          enum: [ENROLLED, ATTENDED, ABSENT, CANCELLED]
          example: ENROLLED
        attendedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        cancellationReason:
          type: string
          nullable: true
        user:
          $ref: '#/components/schemas/User'
        session:
          $ref: '#/components/schemas/Session'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateEnrolmentInput:
      type: object
      required:
        - sessionId
      properties:
        sessionId:
          type: string
          example: cm3n7t4xg0000j4k5a1b2c3d

    MarkAttendanceInput:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ATTENDED, ABSENT]
          example: ATTENDED

    CancelEnrolmentInput:
      type: object
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          example: Schedule conflict

    EnrolmentFilters:
      type: object
      properties:
        status:
          type: string
          enum: [ENROLLED, ATTENDED, ABSENT, CANCELLED]
        sessionId:
          type: string
        fromDate:
          type: string
          format: date-time
        toDate:
          type: string
          format: date-time
        page:
          type: integer
          minimum: 1
          default: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 10

    # ==================== CERTIFICATE SCHEMAS ====================
    Certificate:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        sessionId:
          type: string
        certCode:
          type: string
          pattern: '^CERT-[A-F0-9]{16}$'
          example: CERT-ABC123DEF4567890
        issuedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        revokedReason:
          type: string
          nullable: true
        pdfUrl:
          type: string
          nullable: true
          example: https://res.cloudinary.com/aicn/certificates/cert-abc123.pdf
        pdfPublicId:
          type: string
          nullable: true
        pdfVersion:
          type: string
          nullable: true
        pdfSize:
          type: integer
          nullable: true
          description: PDF file size in bytes
        pdfFormat:
          type: string
          nullable: true
          example: pdf
        pdfResourceType:
          type: string
          nullable: true
        pdfCreatedAt:
          type: string
          format: date-time
          nullable: true
        pdfEtag:
          type: string
          nullable: true
        pdfSignature:
          type: string
          nullable: true
        pdfAssetFolder:
          type: string
          nullable: true
        pdfOriginalFilename:
          type: string
          nullable: true
        pdfGenerationFailed:
          type: boolean
          nullable: true
          description: True if PDF generation, email delivery, or storage upload failed after the certificate record was created
        pdfFailureReason:
          type: string
          nullable: true
        pdfFailedAt:
          type: string
          format: date-time
          nullable: true
        user:
          $ref: '#/components/schemas/User'
        session:
          $ref: '#/components/schemas/Session'

    CertificateWithPdfDetails:
      description: |
        Shape returned by POST /certificates on success: the created Certificate
        plus a condensed pdfDetails block. If PDF generation, email, or upload
        fails, the plain Certificate (pdfGenerationFailed=true, pdfFailureReason set)
        is returned instead, without pdfDetails.
      allOf:
        - $ref: '#/components/schemas/Certificate'
        - type: object
          properties:
            pdfDetails:
              type: object
              nullable: true
              properties:
                url:
                  type: string
                  example: https://res.cloudinary.com/aicn/certificates/cert-abc123.pdf
                publicId:
                  type: string
                size:
                  type: integer
                version:
                  type: string

    IssueCertificateInput:
      type: object
      required:
        - userId
        - sessionId
      properties:
        userId:
          type: string
          format: uuid
          example: cm3n7t4xg0000j4k5a1b2c3d
        sessionId:
          type: string
          format: uuid
          example: cm3n7t4xg0000j4k5a1b2c3d

    BatchIssueResult:
      type: object
      properties:
        issued:
          type: integer
          example: 8
        failed:
          type: integer
          example: 2
        errors:
          type: array
          items:
            type: object
            properties:
              userId:
                type: string
              userName:
                type: string
              error:
                type: string

    CertificateStats:
      type: object
      properties:
        total:
          type: integer
          example: 142
        active:
          type: integer
          example: 138
        revoked:
          type: integer
          example: 4
        thisMonth:
          type: integer
          example: 23

    # ==================== TRAINER SCHEMAS ====================
    TrainerProfile:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        bio:
          type: string
          maxLength: 1000
          nullable: true
        skills:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
          example: ["JavaScript", "React", "Node.js"]
        availability:
          type: string
          maxLength: 200
          nullable: true
        motivation:
          type: string
          maxLength: 1000
          nullable: true
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
          example: PENDING
        rejectedReason:
          type: string
          nullable: true
        approvedAt:
          type: string
          format: date-time
          nullable: true
        rejectedAt:
          type: string
          format: date-time
          nullable: true
        user:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ApplyTrainerInput:
      type: object
      required:
        - skills
      properties:
        bio:
          type: string
          maxLength: 1000
          example: Experienced developer with 5 years of teaching
        skills:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
          example: ["JavaScript", "React", "Node.js"]
        availability:
          type: string
          maxLength: 200
          example: Weekends and evenings
        motivation:
          type: string
          maxLength: 1000
          example: I want to help others learn programming

    UpdateTrainerProfileInput:
      type: object
      properties:
        bio:
          type: string
          maxLength: 1000
        skills:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
        availability:
          type: string
          maxLength: 200
        motivation:
          type: string
          maxLength: 1000

    RejectTrainerInput:
      type: object
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 500
          example: Does not meet minimum experience requirements
        feedback:
          type: string
          maxLength: 1000
          example: Please gain more industry experience before reapplying

    TrainerFilters:
      type: object
      properties:
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        skill:
          type: string
        search:
          type: string
        page:
          type: integer
          minimum: 1
          default: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 10

    PublicTrainer:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        profilePicture:
          type: string
          nullable: true
        skills:
          type: array
          items:
            type: string
        bio:
          type: string
          nullable: true
        availability:
          type: string
          nullable: true
        totalCompletedSessions:
          type: integer
        joinedAt:
          type: string
          format: date-time

    # ==================== ANNOUNCEMENT SCHEMAS ====================
    Announcement:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
          minLength: 3
          maxLength: 200
        body:
          type: string
          minLength: 10
          maxLength: 5000
        audience:
          type: string
          enum: [all, learners, trainers]
          default: all
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAnnouncementInput:
      type: object
      required:
        - title
        - body
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
          example: System Maintenance
        body:
          type: string
          minLength: 10
          maxLength: 5000
          example: We will perform maintenance on Sunday at 2 AM
        audience:
          type: string
          enum: [all, learners, trainers]
          default: all

    UpdateAnnouncementInput:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        body:
          type: string
          minLength: 10
          maxLength: 5000
        audience:
          type: string
          enum: [all, learners, trainers]

    AnnouncementFilters:
      type: object
      properties:
        audience:
          type: string
          enum: [all, learners, trainers]
        fromDate:
          type: string
          format: date-time
        toDate:
          type: string
          format: date-time
        page:
          type: integer
          minimum: 1
          default: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 10

    # ==================== ADMIN SCHEMAS ====================
    AdminStats:
      type: object
      properties:
        learners:
          type: integer
          example: 200
        trainers:
          type: integer
          example: 40
        sessions:
          type: integer
          example: 50
        certificates:
          type: integer
          example: 320
        pendingTrainerApplications:
          type: integer
          example: 8

    UpdateUserRoleInput:
      type: object
      required:
        - newRole
      properties:
        newRole:
          type: string
          enum: [LEARNER, TRAINER, ADMIN]
          example: TRAINER
        approvalMessage:
          type: string
          maxLength: 500
          example: Promoted for excellent performance
        rejectionReason:
          type: string
          maxLength: 500
          example: Does not meet requirements
        isRejection:
          type: boolean
          default: false

    UserFilters:
      type: object
      properties:
        role:
          type: string
          enum: [LEARNER, TRAINER, ADMIN]
        search:
          type: string
          minLength: 1
          maxLength: 100
        page:
          type: integer
          minimum: 1
          default: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 10

    # ==================== COMMON RESPONSES ====================
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        code:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
              received:
                type: string
              expected:
                type: string

    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: array
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer
            hasNextPage:
              type: boolean
            hasPrevPage:
              type: boolean

  responses:
    UnauthorizedError:
      description: Authentication required - missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Unauthorized: No token provided"
            code: AUTHENTICATION_ERROR

    ForbiddenError:
      description: Insufficient permissions - user lacks required role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Access denied. Admin role required.
            code: AUTHORIZATION_ERROR

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Session not found
            code: NOT_FOUND

    ValidationError:
      description: Validation failed - request data doesn't meet schema requirements
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Validation failed
            code: VALIDATION_ERROR
            errors:
              - field: email
                message: Invalid email format
                received: invalid-email

    ConflictError:
      description: Resource conflict - duplicate or state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: User with email john@example.com already exists
            code: CONFLICT_ERROR

# ==================== PATH DEFINITIONS ====================
paths:
  # ==================== HEALTH CHECK ====================
  /health:
    get:
      summary: Health check endpoint
      description: Returns the API health status
      tags: [System]
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  timestamp:
