openapi: 3.0.0
info:
  title: Training Management System API
  version: 2.0.0
  description: Complete API documentation for Training Sessions Management System
  contact:
    name: API Support
    email: support@trainingsystem.com

servers:
  - url: http://localhost:3000/api/v1
    description: Development server
  - url: https://api.trainingsystem.com/api/v1
    description: Production server

tags:
  - name: Authentication
    description: User authentication and profile management
  - name: Sessions
    description: Training session management
  - name: Enrolments
    description: Session enrolment operations
  - name: Certificates
    description: Certificate issuance and verification
  - name: Trainers
    description: Trainer application and management
  - name: Announcements
    description: System announcements
  - name: Admin
    description: Administrative operations (ADMIN only)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your JWT token

  schemas:
    # User Schemas
    User:
      type: object
      properties:
        id:
          type: string
          example: usr_2xK3pQ7VnM
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        phone:
          type: string
          pattern: '^\+?254[0-9]{9}$|^0[0-9]{9}$'
          example: +254712345678
        county:
          type: string
          example: Nairobi
        role:
          type: string
          enum: [LEARNER, TRAINER, ADMIN]
          example: LEARNER
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # Auth Schemas
    SignupRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          format: password
          minLength: 6
          example: Password123!
        phone:
          type: string
          example: +254712345678
        county:
          type: string
          example: Nairobi
        role:
          type: string
          enum: [LEARNER, TRAINER]
          default: LEARNER

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          format: password
          example: Password123!

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expiresIn:
          type: integer
          example: 604800000

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          pattern: '^\+?254[0-9]{9}$|^0[0-9]{9}$'
        county:
          type: string
          minLength: 2
          maxLength: 50

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
        - confirmPassword
      properties:
        currentPassword:
          type: string
          example: OldPassword123!
        newPassword:
          type: string
          minLength: 6
          example: NewPassword456!
        confirmPassword:
          type: string
          example: NewPassword456!

    # Session Schemas
    Session:
      type: object
      properties:
        id:
          type: string
          example: sess_2xK3pQ7VnM
        title:
          type: string
          minLength: 3
          maxLength: 200
          example: Advanced JavaScript Workshop
        skillArea:
          type: string
          example: Programming
        description:
          type: string
          example: Deep dive into modern JavaScript features
        date:
          type: string
          format: date-time
          example: 2024-12-15T10:00:00Z
        durationMins:
          type: integer
          minimum: 30
          maximum: 480
          example: 120
        locationType:
          type: string
          enum: [PHYSICAL, ONLINE]
          example: ONLINE
        venue:
          type: string
          example: https://zoom.us/join/123456
        county:
          type: string
          example: Nairobi
        capacity:
          type: integer
          minimum: 1
          maximum: 100
          example: 30
        status:
          type: string
          enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED]
          example: SCHEDULED
        trainerId:
          type: string
          example: usr_2xK3pQ7VnM
        trainer:
          $ref: '#/components/schemas/User'
        enrolledCount:
          type: integer
          example: 15
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateSessionInput:
      type: object
      required:
        - title
        - skillArea
        - date
        - durationMins
        - locationType
        - capacity
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
          example: Advanced JavaScript Workshop
        skillArea:
          type: string
          minLength: 2
          maxLength: 100
          example: Programming
        description:
          type: string
          maxLength: 2000
          example: Deep dive into modern JavaScript features
        date:
          type: string
          format: date-time
          example: 2024-12-15T10:00:00Z
        durationMins:
          type: integer
          minimum: 30
          maximum: 480
          default: 120
          example: 120
        locationType:
          type: string
          enum: [PHYSICAL, ONLINE]
          default: PHYSICAL
          example: ONLINE
        venue:
          type: string
          minLength: 3
          maxLength: 500
          example: https://zoom.us/join/123456
        county:
          type: string
          minLength: 2
          maxLength: 50
          example: Nairobi
        capacity:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
          example: 30
        trainerId:
          type: string
          example: usr_2xK3pQ7VnM

    UpdateSessionInput:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        skillArea:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        date:
          type: string
          format: date-time
        durationMins:
          type: integer
          minimum: 30
          maximum: 480
        locationType:
          type: string
          enum: [PHYSICAL, ONLINE]
        venue:
          type: string
          minLength: 3
          maxLength: 500
        county:
          type: string
          minLength: 2
          maxLength: 50
        capacity:
          type: integer
          minimum: 1
          maximum: 100
        status:
          type: string
          enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED]

    # Enrolment Schemas
    Enrolment:
      type: object
      properties:
        id:
          type: string
          example: enr_2xK3pQ7VnM
        userId:
          type: string
          example: usr_2xK3pQ7VnM
        sessionId:
          type: string
          example: sess_2xK3pQ7VnM
        status:
          type: string
          enum: [ENROLLED, ATTENDED, ABSENT, CANCELLED]
          example: ENROLLED
        user:
          $ref: '#/components/schemas/User'
        session:
          $ref: '#/components/schemas/Session'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateEnrolmentInput:
      type: object
      required:
        - sessionId
      properties:
        sessionId:
          type: string
          format: cuid
          example: sess_2xK3pQ7VnM

    UpdateEnrolmentInput:
      type: object
      properties:
        status:
          type: string
          enum: [ATTENDED, ABSENT, CANCELLED]
          description: Cannot update to ENROLLED status directly
          example: ATTENDED

    BulkEnrolmentInput:
      type: object
      required:
        - sessionId
        - userIds
      properties:
        sessionId:
          type: string
          format: cuid
          example: sess_2xK3pQ7VnM
        userIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: cuid
          example:
            - usr_abc123
            - usr_def456

    # Certificate Schemas
    Certificate:
      type: object
      properties:
        id:
          type: string
          example: cert_2xK3pQ7VnM
        userId:
          type: string
          example: usr_2xK3pQ7VnM
        sessionId:
          type: string
          example: sess_2xK3pQ7VnM
        certCode:
          type: string
          pattern: '^CERT-[A-F0-9]{16}$'
          example: CERT-ABC123DEF456XYZ
        issuedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        revokedReason:
          type: string
          nullable: true
        user:
          $ref: '#/components/schemas/User'
        session:
          $ref: '#/components/schemas/Session'

    IssueCertificateInput:
      type: object
      required:
        - userId
        - sessionId
      properties:
        userId:
          type: string
          format: cuid
          example: usr_2xK3pQ7VnM
        sessionId:
          type: string
          format: cuid
          example: sess_2xK3pQ7VnM

    VerifyCertificateInput:
      type: object
      required:
        - certCode
      properties:
        certCode:
          type: string
          pattern: '^CERT-[A-F0-9]{16}$'
          example: CERT-ABC123DEF456XYZ

    # Trainer Schemas
    TrainerProfile:
      type: object
      properties:
        id:
          type: string
          example: trn_2xK3pQ7VnM
        userId:
          type: string
          example: usr_2xK3pQ7VnM
        bio:
          type: string
          maxLength: 1000
          example: Experienced software developer
        skills:
          type: array
          items:
            type: string
          example:
            - JavaScript
            - React
        availability:
          type: string
          maxLength: 200
          example: Weekends
        motivation:
          type: string
          maxLength: 1000
          example: Passionate about teaching
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
          example: APPROVED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateTrainerProfileInput:
      type: object
      required:
        - skills
      properties:
        bio:
          type: string
          maxLength: 1000
        skills:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
        availability:
          type: string
          maxLength: 200
        motivation:
          type: string
          maxLength: 1000

    UpdateTrainerProfileInput:
      type: object
      properties:
        bio:
          type: string
          maxLength: 1000
        skills:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
        availability:
          type: string
          maxLength: 200
        motivation:
          type: string
          maxLength: 1000

    UpdateTrainerStatusInput:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [APPROVED, REJECTED]
          example: APPROVED

    # Announcement Schemas
    Announcement:
      type: object
      properties:
        id:
          type: string
          example: ann_2xK3pQ7VnM
        title:
          type: string
          minLength: 3
          maxLength: 200
          example: System Maintenance
        body:
          type: string
          minLength: 10
          maxLength: 5000
          example: System will be down for maintenance
        audience:
          type: string
          enum: [all, learners, trainers]
          example: all
        createdAt:
          type: string
          format: date-time

    CreateAnnouncementInput:
      type: object
      required:
        - title
        - body
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
          example: New Feature Release
        body:
          type: string
          minLength: 10
          maxLength: 5000
          example: We're excited to announce...
        audience:
          type: string
          enum: [all, learners, trainers]
          default: all

    UpdateAnnouncementInput:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        body:
          type: string
          minLength: 10
          maxLength: 5000
        audience:
          type: string
          enum: [all, learners, trainers]

    # Common Schemas
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation successful
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: An error occurred
        statusCode:
          type: integer
          example: 400

    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed
        statusCode:
          type: integer
          example: 400
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
        pagination:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 10
            total:
              type: integer
              example: 100
            totalPages:
              type: integer
              example: 10

  responses:
    UnauthorizedError:
      description: Authentication token is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: No token provided
            statusCode: 401

    ForbiddenError:
      description: User does not have required permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Access denied. Required role: ADMIN
            statusCode: 403

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Resource not found
            statusCode: 404

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

security:
  - bearerAuth: []

paths:
  # Authentication endpoints
  /auth/signup:
    post:
      summary: Register a new user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: User already exists

  /auth/login:
    post:
      summary: Login user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/me:
    get:
      summary: Get current user profile
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # Sessions endpoints
  /sessions:
    get:
      summary: Get all sessions
      tags: [Sessions]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Sessions retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      summary: Create a new session
      tags: [Sessions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionInput'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /sessions/{id}:
    get:
      summary: Get session by ID
      tags: [Sessions]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      summary: Update session
      tags: [Sessions]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionInput'
      responses:
        '200':
          description: Session updated
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      summary: Delete session
      tags: [Sessions]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session deleted
        '403':
          $ref: '#/components/responses/ForbiddenError'

  # Enrolments endpoints
  /enrolments:
    get:
      summary: Get all enrolments
      tags: [Enrolments]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ENROLLED, ATTENDED, ABSENT, CANCELLED]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Enrolments retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'

    post:
      summary: Enroll in a session
      tags: [Enrolments]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrolmentInput'
      responses:
        '201':
          description: Enrolled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Enrolment'

  /enrolments/{id}:
    delete:
      summary: Cancel enrolment
      tags: [Enrolments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Enrolment cancelled

  # Certificates endpoints
  /certificates:
    post:
      summary: Issue certificate (ADMIN only)
      tags: [Certificates]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCertificateInput'
      responses:
        '201':
          description: Certificate issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Certificate'

  /certificates/verify/{certCode}:
    get:
      summary: Verify certificate
      tags: [Certificates]
      parameters:
        - name: certCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Certificate is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Certificate'
        '410':
          description: Certificate revoked

  /certificates/my:
    get:
      summary: Get my certificates
      tags: [Certificates]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Certificates retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Certificate'

  # Trainers endpoints
  /trainers/apply:
    post:
      summary: Apply to become a trainer
      tags: [Trainers]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrainerProfileInput'
      responses:
        '201':
          description: Application submitted

  /trainers/me:
    get:
      summary: Get my trainer profile
      tags: [Trainers]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved

    patch:
      summary: Update my trainer profile
      tags: [Trainers]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTrainerProfileInput'
      responses:
        '200':
          description: Profile updated

  # Announcements endpoints
  /announcements:
    get:
      summary: Get all announcements
      tags: [Announcements]
      parameters:
        - name: audience
          in: query
          schema:
            type: string
            enum: [all, learners, trainers]
      responses:
        '200':
          description: Announcements retrieved

  /admin/announcements:
    post:
      summary: Create announcement (ADMIN only)
      tags: [Admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnnouncementInput'
      responses:
        '201':
          description: Announcement created