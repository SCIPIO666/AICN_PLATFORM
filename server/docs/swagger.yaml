openapi: 3.0.0
info:
  title: AICN Training Management System API
  version: 2.0.0
  description: |
    Complete API documentation for the redesigned Training Management System.
    
    ## Features
    * Public session browsing with advanced filters
    * Self-service enrolment and cancellation
    * Trainer attendance tracking
    * Certificate management with batch issuance
    * Admin dashboard with user management
    * Trainer application workflow
    
    ## Authentication
    Most endpoints require JWT authentication. Include the token in requests:
    
    `Authorization: Bearer <your-token>`
    
    ## Role-Based Access Control
    
    | Role | Permissions |
    |------|-------------|
    | **LEARNER** | Browse sessions, enrol, cancel own enrolments, view own certificates |
    | **TRAINER** | All LEARNER permissions + mark attendance, view assigned sessions |
    | **ADMIN** | Full system access + user management, batch operations, announcements |
    
  contact:
    name: API Support
    email: support@aicn.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000/api
    description: Development server
  - url: https://staging-api.aicn.com/api
    description: Staging server
  - url: https://api.aicn.com/api
    description: Production server

tags:
  - name: Authentication
    description: User registration, login, and profile management
  - name: Sessions
    description: Public session browsing and management (ADMIN only for write)
  - name: Enrolments
    description: Self-service enrolment and attendance tracking
  - name: Certificates
    description: Certificate issuance, verification, and download
  - name: Trainers
    description: Trainer application and management
  - name: Admin
    description: Administrative operations (ADMIN only)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your JWT token

  schemas:
    # User Schemas
    User:
      type: object
      properties:
        id:
          type: string
          example: usr_2xK3pQ7VnM
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        phone:
          type: string
          pattern: '^\+?254[0-9]{9}$|^0[0-9]{9}$'
          example: +254712345678
        county:
          type: string
          example: Nairobi
        role:
          type: string
          enum: [LEARNER, TRAINER, ADMIN]
          example: LEARNER
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # Auth Schemas
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          format: password
          minLength: 6
          example: Password123!
        phone:
          type: string
          example: +254712345678
        county:
          type: string
          example: Nairobi

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          format: password
          example: Password123!

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        expiresIn:
          type: integer
          example: 604800000

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          pattern: '^\+?254[0-9]{9}$|^0[0-9]{9}$'
        county:
          type: string
          minLength: 2
          maxLength: 50

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
        - confirmPassword
      properties:
        currentPassword:
          type: string
          example: OldPassword123!
        newPassword:
          type: string
          minLength: 6
          example: NewPassword456!
        confirmPassword:
          type: string
          example: NewPassword456!

    # Session Schemas
    Session:
      type: object
      properties:
        id:
          type: string
          example: sess_2xK3pQ7VnM
        title:
          type: string
          example: Advanced JavaScript Workshop
        skillArea:
          type: string
          example: Programming
        description:
          type: string
          example: Deep dive into modern JavaScript
        date:
          type: string
          format: date-time
          example: 2024-12-15T10:00:00Z
        durationMins:
          type: integer
          minimum: 30
          maximum: 480
          example: 120
        locationType:
          type: string
          enum: [PHYSICAL, ONLINE]
          example: ONLINE
        venue:
          type: string
          example: https://zoom.us/join/123456
        county:
          type: string
          example: Nairobi
        capacity:
          type: integer
          minimum: 1
          maximum: 100
          example: 30
        status:
          type: string
          enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED]
          example: SCHEDULED
        trainerId:
          type: string
          example: usr_2xK3pQ7VnM
        enrolledCount:
          type: integer
          example: 15
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateSessionInput:
      type: object
      required:
        - title
        - skillArea
        - date
        - durationMins
        - locationType
        - capacity
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        skillArea:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        date:
          type: string
          format: date-time
        durationMins:
          type: integer
          minimum: 30
          maximum: 480
          default: 120
        locationType:
          type: string
          enum: [PHYSICAL, ONLINE]
          default: PHYSICAL
        venue:
          type: string
        county:
          type: string
        capacity:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
        trainerId:
          type: string

    UpdateSessionInput:
      type: object
      properties:
        title:
          type: string
        skillArea:
          type: string
        description:
          type: string
        date:
          type: string
          format: date-time
        durationMins:
          type: integer
        locationType:
          type: string
          enum: [PHYSICAL, ONLINE]
        venue:
          type: string
        county:
          type: string
        capacity:
          type: integer
        status:
          type: string
          enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED]

    # Enrolment Schemas
    Enrolment:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        sessionId:
          type: string
        status:
          type: string
          enum: [ENROLLED, ATTENDED, ABSENT, CANCELLED]
        user:
          $ref: '#/components/schemas/User'
        session:
          $ref: '#/components/schemas/Session'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateEnrolmentInput:
      type: object
      required:
        - sessionId
      properties:
        sessionId:
          type: string
          example: sess_2xK3pQ7VnM

    MarkAttendanceInput:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ATTENDED, ABSENT]
          example: ATTENDED

    # Certificate Schemas
    Certificate:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        sessionId:
          type: string
        certCode:
          type: string
          example: CERT-ABC123DEF456
        issuedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        revokedReason:
          type: string
          nullable: true

    IssueCertificateInput:
      type: object
      required:
        - userId
        - sessionId
      properties:
        userId:
          type: string
        sessionId:
          type: string

    BatchIssueResult:
      type: object
      properties:
        issued:
          type: integer
          example: 5
        failed:
          type: integer
          example: 1
        errors:
          type: array
          items:
            type: object
            properties:
              userId:
                type: string
              userName:
                type: string
              error:
                type: string

    # Trainer Schemas
    TrainerProfile:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        bio:
          type: string
        skills:
          type: array
          items:
            type: string
        availability:
          type: string
        motivation:
          type: string
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        user:
          $ref: '#/components/schemas/User'

    ApplyTrainerInput:
      type: object
      required:
        - skills
      properties:
        bio:
          type: string
          maxLength: 1000
        skills:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
        availability:
          type: string
          maxLength: 200
        motivation:
          type: string
          maxLength: 1000

    UpdateTrainerStatusInput:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [APPROVED, REJECTED]

    # Admin Schemas
    AdminStats:
      type: object
      properties:
        learners:
          type: integer
          example: 150
        trainers:
          type: integer
          example: 25
        sessions:
          type: integer
          example: 45
        certificates:
          type: integer
          example: 120
        pendingTrainerApplications:
          type: integer
          example: 8

    UpdateUserRoleInput:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum: [LEARNER, TRAINER, ADMIN]

    Announcement:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        audience:
          type: string
          enum: [all, learners, trainers]
        createdAt:
          type: string
          format: date-time

    CreateAnnouncementInput:
      type: object
      required:
        - title
        - body
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        body:
          type: string
          minLength: 10
          maxLength: 5000
        audience:
          type: string
          enum: [all, learners, trainers]
          default: all

    # Common Responses
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        statusCode:
          type: integer

    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer

  responses:
    UnauthorizedError:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

# ==================== PATH DEFINITIONS ====================

paths:
  # ==================== AUTHENTICATION ====================
  /auth/register:
    post:
      summary: Register a new user
      description: Creates a new user account with LEARNER role by default
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email already exists

  /auth/login:
    post:
      summary: Login user
      description: Authenticates user and returns JWT token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/logout:
    post:
      summary: Logout user
      description: Invalidates the current JWT token
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /auth/me:
    get:
      summary: Get current user profile
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/User'
    patch:
      summary: Update current user profile
      tags: [Authentication]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
    delete:
      summary: Delete current user account (soft delete)
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account deleted successfully

  /auth/me/password:
    patch:
      summary: Change password
      tags: [Authentication]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully

  # ==================== SESSIONS ====================
  /sessions:
    get:
      summary: Get all sessions (PUBLIC)
      description: Browse sessions with optional filters. No authentication required.
      tags: [Sessions]
      parameters:
        - name: upcoming
          in: query
          schema:
            type: boolean
          description: Filter to upcoming sessions only
        - name: skillArea
          in: query
          schema:
            type: string
          description: Filter by skill area
        - name: county
          in: query
          schema:
            type: string
          description: Filter by county
        - name: status
          in: query
          schema:
            type: string
            enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Sessions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'

    post:
      summary: Create a new session (ADMIN only)
      tags: [Sessions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionInput'
      responses:
        '201':
          description: Session created successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /sessions/{id}:
    get:
      summary: Get session by ID (PUBLIC)
      tags: [Sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      summary: Update session (ADMIN only)
      tags: [Sessions]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionInput'
      responses:
        '200':
          description: Session updated successfully

    delete:
      summary: Cancel session (ADMIN only - soft delete)
      description: Sets session status to CANCELLED
      tags: [Sessions]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
      responses:
        '200':
          description: Session cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Session'

  # ==================== ENROLMENTS ====================
  /enrolments:
    post:
      summary: Enroll in a session
      description: Authenticated users can enroll in available sessions
      tags: [Enrolments]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrolmentInput'
      responses:
        '201':
          description: Successfully enrolled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Enrolment'
        '400':
          description: Session full or unavailable
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /enrolments/me:
    get:
      summary: Get my enrolments
      description: Returns enrolments for the authenticated user only
      tags: [Enrolments]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ENROLLED, ATTENDED, ABSENT, CANCELLED]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Enrolments retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'

  /enrolments/{id}/attend:
    patch:
      summary: Mark attendance (TRAINER/ADMIN only)
      description: Mark a user as ATTENDED or ABSENT for a session
      tags: [Enrolments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkAttendanceInput'
      responses:
        '200':
          description: Attendance marked successfully
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /enrolments/{id}/cancel:
    patch:
      summary: Cancel my enrolment
      description: Users can cancel their own enrolment if not yet attended
      tags: [Enrolments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Enrolment cancelled successfully
        '400':
          description: Cannot cancel attended enrolment
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ==================== CERTIFICATES ====================
  /certificates/me:
    get:
      summary: Get my certificates
      tags: [Certificates]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Certificates retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Certificate'

  /certificates/verify/{certCode}:
    get:
      summary: Verify a certificate (PUBLIC)
      tags: [Certificates]
      parameters:
        - name: certCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Certificate is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Certificate'
        '404':
          description: Certificate not found
        '410':
          description: Certificate has been revoked

  /certificates/me/download/{id}:
    get:
      summary: Download certificate PDF
      tags: [Certificates]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /certificates:
    post:
      summary: Issue certificate (ADMIN only)
      tags: [Certificates]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCertificateInput'
      responses:
        '201':
          description: Certificate issued
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /certificates/batch/{sessionId}:
    post:
      summary: Batch issue certificates (ADMIN only)
      description: Issue certificates to all ATTENDED users in a session
      tags: [Certificates]
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Batch issuance completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/BatchIssueResult'

  /certificates/{id}:
    delete:
      summary: Revoke certificate (ADMIN only)
      tags: [Certificates]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Certificate revoked

  # ==================== TRAINERS ====================
  /trainers:
    get:
      summary: Get all trainers (PUBLIC)
      description: Returns approved trainers only
      tags: [Trainers]
      parameters:
        - name: skill
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Trainers retrieved

  /trainers/apply:
    post:
      summary: Apply to become a trainer
      tags: [Trainers]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyTrainerInput'
      responses:
        '201':
          description: Application submitted successfully

  /trainers/me:
    get:
      summary: Get my trainer profile
      tags: [Trainers]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved
        '404':
          description: No trainer profile found

    patch:
      summary: Update my trainer profile (PENDING only)
      tags: [Trainers]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyTrainerInput'
      responses:
        '200':
          description: Profile updated
        '403':
          description: Cannot update approved application

    delete:
      summary: Withdraw trainer application (PENDING only)
      tags: [Trainers]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Application withdrawn

  /trainers/me/sessions:
    get:
      summary: Get my assigned sessions (TRAINER/ADMIN only)
      description: Returns sessions where user is the trainer, with enrolments
      tags: [Trainers]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED]
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Sessions retrieved
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /trainers/admin/all:
    get:
      summary: Get all trainer applications (ADMIN only)
      tags: [Trainers]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
        - name: skill
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Applications retrieved

  /trainers/admin/{id}/status:
    patch:
      summary: Approve/Reject trainer application (ADMIN only)
      tags: [Trainers]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTrainerStatusInput'
      responses:
        '200':
          description: Status updated

  # ==================== ADMIN ====================
  /admin/stats:
    get:
      summary: Get dashboard statistics (ADMIN only)
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Statistics retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AdminStats'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /admin/users:
    get:
      summary: Get all users (ADMIN only)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [LEARNER, TRAINER, ADMIN]
        - name: search
          in: query
          schema:
            type: string
          description: Search by name or email
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Users retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'

  /admin/users/{userId}/role:
