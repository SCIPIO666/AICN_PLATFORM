SuccessResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    message:
      type: string
      example: Operation completed successfully
    data:
      type: object

ErrorResponse:
  type: object
  properties:
    success:
      type: boolean
      example: false
    message:
      type: string
      example: An error occurred
    statusCode:
      type: integer
      example: 400

ValidationErrorResponse:
  type: object
  properties:
    success:
      type: boolean
      example: false
    message:
      type: string
      example: Validation failed
    statusCode:
      type: integer
      example: 400
    errors:
      type: array
      items:
        type: object
        properties:
          field:
            type: string
          message:
            type: string

PaginatedResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    data:
      type: array
    pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 10

IdParam:
  type: object
  properties:
    id:
      type: string
      description: Resource ID
      example: res_2xK3pQ7VnM