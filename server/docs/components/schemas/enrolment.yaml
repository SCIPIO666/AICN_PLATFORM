Enrolment:
  type: object
  properties:
    id:
      type: string
      example: enr_2xK3pQ7VnM
    userId:
      type: string
      example: usr_2xK3pQ7VnM
    sessionId:
      type: string
      example: sess_2xK3pQ7VnM
    status:
      type: string
      enum: [ENROLLED, ATTENDED, ABSENT, CANCELLED]
      example: ENROLLED
    user:
      $ref: './user.yaml#/User'
    session:
      $ref: './session.yaml#/Session'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

EnrolmentSummary:
  type: object
  properties:
    id:
      type: string
    sessionId:
      type: string
    sessionTitle:
      type: string
    status:
      type: string
    enrolledAt:
      type: string
      format: date-time

CreateEnrolmentInput:
  type: object
  required:
    - sessionId
  properties:
    sessionId:
      type: string
      format: cuid
      example: sess_2xK3pQ7VnM

UpdateEnrolmentInput:
  type: object
  properties:
    status:
      type: string
      enum: [ATTENDED, ABSENT, CANCELLED]
      description: Cannot update to ENROLLED status directly
      example: ATTENDED

BulkEnrolmentInput:
  type: object
  required:
    - sessionId
    - userIds
  properties:
    sessionId:
      type: string
      format: cuid
      example: sess_2xK3pQ7VnM
    userIds:
      type: array
      minItems: 1
      maxItems: 100
      items:
        type: string
        format: cuid
      example:
        - usr_abc123
        - usr_def456
        - usr_ghi789