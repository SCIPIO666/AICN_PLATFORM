Announcement:
  type: object
  properties:
    id:
      type: string
      example: ann_2xK3pQ7VnM
    title:
      type: string
      minLength: 3
      maxLength: 200
      example: System Maintenance Scheduled
    body:
      type: string
      minLength: 10
      maxLength: 5000
      example: The system will be down for maintenance on Saturday from 2 AM to 4 AM EAT.
    audience:
      type: string
      enum: [all, learners, trainers]
      example: all
    createdAt:
      type: string
      format: date-time

CreateAnnouncementInput:
  type: object
  required:
    - title
    - body
  properties:
    title:
      type: string
      minLength: 3
      maxLength: 200
      example: New Feature Release
    body:
      type: string
      minLength: 10
      maxLength: 5000
      example: We're excited to announce the launch of our new certificate verification system!
    audience:
      type: string
      enum: [all, learners, trainers]
      default: all

UpdateAnnouncementInput:
  type: object
  properties:
    title:
      type: string
      minLength: 3
      maxLength: 200
    body:
      type: string
      minLength: 10
      maxLength: 5000
    audience:
      type: string
      enum: [all, learners, trainers]